name: Build semantic ONNX model

on:
  workflow_dispatch:
  push:
    paths:
      - 'skills/builtin.json'
      - 'scripts/build-repo-training.py'
      - 'scripts/train-semantic.py'
      - '.github/workflows/build-semantic-model.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install training runtime
        run: python -m pip install --upgrade pip numpy onnx onnxruntime
      - name: Build repository training set
        run: python scripts/build-repo-training.py
      - name: Train and export ONNX
        run: python scripts/train-semantic.py training/repo-training.jsonl --output-dir build/semantic-model
      - name: Validate ONNX
        run: |
          python - <<'PY'
          import json, numpy as np, onnxruntime as ort
          from pathlib import Path
          model=Path('build/semantic-model/semantic.onnx')
          labels=json.loads(Path('build/semantic-model/labels.json').read_text())['labels']
          sess=ort.InferenceSession(str(model),providers=['CPUExecutionProvider'])
          x=np.zeros((1,2048),dtype='float32')
          y=sess.run(None,{sess.get_inputs()[0].name:x})[0]
          assert y.shape[1]==len(labels),(y.shape,len(labels))
          print('ONNX_MODEL_VALID',y.shape)
          PY
      - name: Encode model for repository transport
        run: |
          mkdir -p models
          base64 -w 0 build/semantic-model/semantic.onnx > models/semantic.onnx.b64
          cp build/semantic-model/labels.json models/semantic-labels.json
          cp build/semantic-model/metadata.json models/semantic-metadata.json
      - name: Commit generated model
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add models/semantic.onnx.b64 models/semantic-labels.json models/semantic-metadata.json
          if git diff --cached --quiet; then
            echo 'Model unchanged'
          else
            git commit -m 'Build semantic ONNX model'
            git push
          fi
